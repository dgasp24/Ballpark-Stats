{% extends "layout.html"%}

{% block header %}
<link href="{{ url_for('static', filename='styleMLB.css') }}" rel="stylesheet">
{% endblock %}

{% block body %}

    <div id = "divHeading">
        <header id = "heading" class = "bg-gradient">
            <h1 id = "title" >Ballpark Stats</h1>
                    <a href="{{ url_for('teams') }}">
                        <button type = "submit" id="teamBtn" class = "btn bg-gradient selectionButton">Teams</button>
                    </a>
        </header>
        </div>
     <form id ="selection" >
        <label for="year">Year</label>
        <input type = "text" name ="year" id="year" required><br>
         <label for="PA">Min. PA.</label>
        <input type = "text" name = "PA" id="PA" required><br>

        <label>Player to highlight</label>
        <input name = "player" type="text"><br>

        <select name = "statChoice" required>
            <option value = None>Stat</option>
            <option value = 1>Batting Average</option>
            <option value = 2>OPS</option>
            <option value = 3>Homeruns</option>
            <option value = 4>SLG</option>
        </select>

        <button type = "submit" id="submit" class ="btn bg-gradient selectionButton">Submit</button>

        <label>Graph</label>
        <input type="checkbox" id = "graph">
        <label>Table</label>
        <input type="checkbox" id = "table">
    </form>

    {% if playerStats %}
<div id="divTable" class ="hidden">
            <table class="table" id = "playerTable">
              <thead class ="table-dark">
                <tr>
                  <th scope="col">{{ team }} Players</th>
                  <th scope="col">{{ stat }}</th>
                </tr>
              </thead>
              <tbody>
                 {% for player, stats in playerStats.items() %}
                <tr>
                  <th scope="row">{{ player }}</th>
                  <td>{{ stats }}</td>
                </tr>
              {% endfor %}
              </tbody>
            </table>
    </div>
        {% else %}
            <p></p>
    {% endif %}
    <div id = "graph-container"  class ="hidden">
            {{ graph|safe }}
    </div>
{% endblock %}
